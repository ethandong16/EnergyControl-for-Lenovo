name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Restore, build, test, and layout verify
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore public reference assemblies
        shell: pwsh
        run: dotnet restore .\EnergyControl.csproj --configfile .\NuGet.Config --nologo

      - name: Build portable executable
        shell: pwsh
        run: .\build-ci.ps1 -Clean

      - name: Run protocol and dependency tests
        shell: pwsh
        run: .\tests\run-tests.ps1 -Executable .\bin\Release\net48\EnergyControl.exe

      - name: Run CLI smoke test
        shell: pwsh
        run: |
          .\bin\Release\net48\EnergyControl.exe help
          if ($LASTEXITCODE -ne 0) { throw "CLI help failed with exit code $LASTEXITCODE" }

      - name: Verify multilingual offline help
        shell: pwsh
        run: node .\tests\readme-language.test.js

      - name: Run multilingual GUI DPI and threshold layout tests
        shell: pwsh
        run: .\verify-layout.ps1

      - name: Scan final executable dependencies
        shell: pwsh
        run: |
          $exe = Resolve-Path .\bin\Release\net48\EnergyControl.exe
          $assembly = [Reflection.Assembly]::LoadFile($exe.Path)
          $names = @($assembly.GetReferencedAssemblies() | ForEach-Object Name)
          foreach ($forbidden in @('Newtonsoft.Json','BatteryManagementContract','PowerContract','IdeaNotebookAddin','Lenovo.Vantage.PowerRpcClient')) {
            if ($names -contains $forbidden) { throw "Forbidden reference: $forbidden" }
          }
