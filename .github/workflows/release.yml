name: Release preview

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package unsigned Windows x64 portable release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Clean

      - name: Stage release payload
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'release-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\artifacts\publish\EnergyControl.exe $stage
          Copy-Item .\*.md $stage
          Copy-Item .\LICENSE, .\artifacts\publish\README.html $stage
          Copy-Item -LiteralPath .\docs -Destination $stage -Recurse
          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Name -match 'Lenovo|Newtonsoft|Contract|Addin|\.pdb$|\.log$'
          }
          if ($forbidden) { throw "Forbidden release file: $($forbidden.Name -join ', ')" }

      - name: Create ZIP and SHA-256
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "EnergyControl-for-Lenovo-$tag-windows-x64.zip"
          Compress-Archive -Path .\release-stage\* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            Unsigned preview release for Windows 10/11 x64.

            SmartScreen may warn because this executable is not code-signed. Verify the SHA-256 file before running it. This is an unofficial project, does not include Lenovo private components, and custom percentage thresholds remain experimental.
          files: |
            EnergyControl-for-Lenovo-${{ github.ref_name }}-windows-x64.zip
            EnergyControl-for-Lenovo-${{ github.ref_name }}-windows-x64.zip.sha256
